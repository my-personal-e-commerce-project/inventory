spring:
  application:
    name: inventory
  config:
    import: 
      - optional:classpath:.env[.properties]
      - "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
